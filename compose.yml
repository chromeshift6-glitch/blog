services:
  nginx:
    image: "nginx:1.30.5-alpine"
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public
    depends_on:
      - php
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: env/app.env
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    env_file:
      - env/mysql.env
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: