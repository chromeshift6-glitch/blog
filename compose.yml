services:
  nginx:
    image: "nginx:1.30.5-alpine"
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public
    depends_on:
      php:
        condition: service_healthy
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: env/app.env
    volumes:
      - ./:/var/www/html
      - composer_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/vendor/autoload.php && php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 2m

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    env_file:
      - env/mysql.env
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  mysql_data:
  composer_vendor:
